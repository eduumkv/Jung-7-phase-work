name: Deploy Ciclo de 7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraer aplicación
        shell: bash
        run: |
          set -e

          mkdir -p public

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          unzip -o "$ZIP" -d public

          echo "Contenido extraído:"
          find public -maxdepth 2 -type f

          if [ ! -f "public/index.html" ]; then
            echo "ERROR: index.html no está en la raíz del ZIP"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
